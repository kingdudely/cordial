[workspace]
resolver = "2"
members = [
    "crates/cordial-linker-sys",
    "crates/cordial-runtime",
]

[workspace.package]
version = "0.18.0"
edition = "2021"
license = "GPL-3.0-or-later"
rust-version = "1.75"

[workspace.lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"

[profile.release]
debug = true

# Small distribution build. This leaves the debug-friendly release profile
# untouched and provides a separate profile for the standalone runner.
[profile.minimal]
inherits = "release"
opt-level = "z"
debug = false
strip = "symbols"
lto = true
codegen-units = 1
panic = "abort"
