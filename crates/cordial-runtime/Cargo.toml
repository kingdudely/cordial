[package]
name = "cordial-runtime"
description = "Standalone Linux Roblox runtime"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[[bin]]
name = "roblox"
path = "src/bin/load.rs"

[dependencies]
cordial-linker-sys = { path = "../cordial-linker-sys" }
gtk4 = { version = "0.11", features = ["v4_12"] }
libadwaita = { version = "0.9", features = ["v1_5"] }
gdk4-wayland = "0.11"
ureq = "3.3.0"
serde_json = "1"
zstd = "0.13"
libmimalloc-sys = { version = "0.1.49", features = ["extended"] }
libc = "0.2"
